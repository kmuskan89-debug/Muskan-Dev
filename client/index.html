    <!-- Structured Data (JSON-LD Person) -->

      {
        "@context": "https://schema.org",

        "name": "Muskan Kumari",
        "jobTitle": "MERN Stack Developer",

        "url": "%VITE_SITE_URL%",

          "@type": "PostalAddress",

          "addressRegion": "Punjab",

    <!-- Google Fonts: Bricolage Grotesque (headings), DM Sans (body), JetBrains Mono (weights 500, 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #F5F3E7;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#F5F3E7] text-[#191009] selection:bg-[#F5A01F] selection:text-[#191009] antialiased overflow-x-clip">
    <!-- Minimal static overlay to prevent flash of site before JS loads -->
    <div
      id="intro-static-overlay"
      style="position: fixed; inset: 0; z-index: 99999; background: var(--bg-color, #F5F3E7); pointer-events: none;"
    ></div>
    <script>
      (function() {
        var el = document.getElementById("intro-static-overlay");
        if (!el) return;
        if (window.location.pathname.startsWith("/admin")) {
          el.remove();
          return;
        }
        setTimeout(function() {
          var overlay = document.getElementById("intro-static-overlay");
          if (overlay) overlay.remove();
        }, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
